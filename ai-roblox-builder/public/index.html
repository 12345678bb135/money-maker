<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Roblox Builder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 80px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      height: 180px;
      margin-top: 30px;
      padding: 18px;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      text-align: left;
      background: #1f2937;
      border-radius: 12px;
      white-space: pre-wrap;
      min-height: 100px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 AI Roblox Builder</h1>

    <p>Describe the Roblox game you want to create.</p>

    <textarea id="prompt"
      placeholder="Example: Make me a realistic police roleplay game with police, sheriff, civilian teams, cars, jobs, money and a leaderboard."></textarea>

    <br>

    <button onclick="generateGame()">Generate Game</button>

    <div id="result">
      Your generated Roblox code will appear here.
    </div>
  </div>

  <script>
    async function generateGame() {
      const prompt = document.getElementById("prompt").value;
      const result = document.getElementById("result");

      if (!prompt.trim()) {
        result.textContent = "Please describe your game first.";
        return;
      }

      result.textContent = "🤖 Building your Roblox game...";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        result.textContent = data.error
          ? data.error
          : "Request received!\\n\\n" + data.prompt;

      } catch (error) {
        result.textContent = "Something went wrong. Please try again.";
      }
    }
  </script>
</body>
</html>
