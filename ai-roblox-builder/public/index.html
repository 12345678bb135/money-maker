<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Roblox Builder</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 48px;
    }

    p {
      text-align: center;
      color: #9ca3af;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 18px;
      margin-top: 25px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 15px 30px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #copyButton {
      display: none;
      margin: 10px auto;
      background: #059669;
    }

    #copyButton:hover {
      background: #047857;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #1f2937;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
      min-height: 150px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎮 AI Roblox Builder</h1>

  <p>Describe the Roblox game you want to build.</p>

  <textarea
    id="prompt"
    placeholder="Example: Build me a realistic police roleplay game..."
  ></textarea>

  <button onclick="generateGame()">🚀 Generate Game</button>

  <button id="copyButton" onclick="copyCode()">📋 Copy Generated Code</button>

  <div id="result">Your AI-generated Roblox code will appear here.</div>

</div>

<script>

let generatedCode = "";

async function generateGame() {

  const prompt = document.getElementById("prompt").value.trim();
  const result = document.getElementById("result");
  const copyButton = document.getElementById("copyButton");

  copyButton.style.display = "none";

  if (!prompt) {
    result.textContent = "Please describe your game first.";
    return;
  }

  result.textContent = "🤖 AI is building your Roblox game...";

  try {

    const response = await fetch("/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    if (!response.ok) {
      result.textContent = "❌ " + (data.error || "Server error");
      return;
    }

    if (data.result) {

      generatedCode = data.result;

      result.textContent = generatedCode;

      copyButton.style.display = "block";

    } else {

      result.textContent =
        "❌ No AI result was returned.\n\n" +
        JSON.stringify(data, null, 2);
    }

  } catch (error) {

    result.textContent =
      "❌ Could not connect to the server.\n\n" +
      error.message;
  }
}

async function copyCode() {

  if (!generatedCode) {
    return;
  }

  try {

    await navigator.clipboard.writeText(generatedCode);

    const button = document.getElementById("copyButton");

    button.textContent = "✅ Copied!";

    setTimeout(() => {
      button.textContent = "📋 Copy Generated Code";
    }, 2000);

  } catch (error) {

    alert("Could not copy the code.");
  }
}

</script>

</body>
</html>
