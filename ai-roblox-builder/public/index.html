<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Roblox Builder</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 48px;
    }

    p {
      text-align: center;
      color: #9ca3af;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 18px;
      margin-top: 25px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 16px;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 15px 30px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #1f2937;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
      min-height: 150px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎮 AI Roblox Builder</h1>

  <p>Describe the Roblox game you want to build.</p>

  <textarea
    id="prompt"
    placeholder="Example: Make a police roleplay game with police, sheriff and civilian teams."
  ></textarea>

  <button onclick="generateGame()">Generate Game</button>

  <div id="result">Your AI-generated Roblox code will appear here.</div>

</div>

<script>

async function generateGame() {

  const prompt = document.getElementById("prompt").value.trim();
  const result = document.getElementById("result");

  if (!prompt) {
    result.textContent = "Please describe your game first.";
    return;
  }

  result.textContent = "🤖 AI is building your Roblox game...";

  try {

    const response = await fetch("/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    console.log("SERVER RESPONSE:", data);

    if (!response.ok) {
      result.textContent = "❌ " + (data.error || "Server error");
      return;
    }

    if (data.result) {
      result.textContent = data.result;
    } else {
      result.textContent =
        "❌ The server responded, but no AI result was returned.\n\n" +
        JSON.stringify(data, null, 2);
    }

  } catch (error) {

    console.error(error);

    result.textContent =
      "❌ Could not connect to the server.\n\n" +
      error.message;
  }
}

</script>

</body>
</html>
